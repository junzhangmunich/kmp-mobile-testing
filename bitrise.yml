format_version: "17"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: kotlin-multiplatform

# Pushes to main and pull requests run the `android` and/or `ios` pipeline,
# depending on the changed files (regex over repo-relative paths).
# Shared modules, Gradle files and this file run both. Any *.gradle.kts counts:
# Gradle configures every module, so one broken script breaks both platforms.
# The iOS app embeds only sharedLogic, so sharedUI and server changes skip iOS.
# Unmatched paths (README.md, .gitignore, new modules) trigger nothing,
# so add new modules to the regexes.
#
# Each pipeline runs its platform's snapshot tests in a workflow of their own
# (android_snapshots, ios_snapshots), in parallel with the unit tests and builds:
# a large set of goldens doesn't hold those up, and a changed screen doesn't
# block the build artifacts.
#
# Pushing a v* tag (e.g. v1.0.1) runs both release workflows, in parallel:
# - `testflight` uploads a signed build to App Store Connect for TestFlight. It
#   needs an Apple service connection with an App Store Connect API key, and an
#   Apple Distribution certificate uploaded to the project's Code Signing settings.
# - `google_play` uploads a signed app bundle to the internal testing track of
#   Google Play. It needs the upload keystore uploaded to the project's Code
#   Signing settings, and the JSON key of a Google Play service account uploaded
#   to its files as SERVICE_ACCOUNT_JSON_KEY. Google Play takes API uploads only
#   after the app's first bundle was uploaded by hand in Play Console.
pipelines:
  android:
    triggers:
      push:
      - branch: main
        changed_files:
          regex: '^((app/androidApp|app/sharedLogic|app/sharedUI|core|server|gradle)/.*|.*\.gradle\.kts|gradle\.properties|gradlew|bitrise\.yml)$'
      pull_request:
      - source_branch: "*"
        changed_files:
          regex: '^((app/androidApp|app/sharedLogic|app/sharedUI|core|server|gradle)/.*|.*\.gradle\.kts|gradle\.properties|gradlew|bitrise\.yml)$'
    workflows:
      android: {}
      android_snapshots: {}
  ios:
    triggers:
      push:
      - branch: main
        changed_files:
          regex: '^((app/iosApp|app/sharedLogic|core|gradle)/.*|.*\.gradle\.kts|gradle\.properties|gradlew|bitrise\.yml)$'
      pull_request:
      - source_branch: "*"
        changed_files:
          regex: '^((app/iosApp|app/sharedLogic|core|gradle)/.*|.*\.gradle\.kts|gradle\.properties|gradlew|bitrise\.yml)$'
    workflows:
      ios: {}
      ios_snapshots: {}

workflows:
  android:
    summary: Unit tests of the shared modules and the server, plus a debug APK.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: standard
    steps:
    - git-clone@8: {}
    - restore-gradle-cache@3: {}
    - gradle-unit-test@2:
        title: Unit tests
        inputs:
        # KMP modules have no plain `test` task, so the tasks are listed explicitly.
        - test_task: >-
            :app:sharedLogic:testAndroidHostTest
            :app:sharedUI:testAndroidHostTest
            :core:testAndroidHostTest
            :core:jvmTest
            :server:test
        # The snapshot tests of :app:sharedUI run in android_snapshots instead.
        # --continue is the step's default.
        - gradlew_command_flags: --continue -Psnapshots=skip
    - gradle-runner@6:
        title: Build debug APK
        inputs:
        - gradle_task: ":app:androidApp:assembleDebug"
    - save-gradle-cache@1: {}
    - deploy-to-bitrise-io@2: {}

  android_snapshots:
    summary: Compose snapshot tests, compared with the goldens in app/sharedUI/src/androidHostTest/snapshots.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: standard
    steps:
    - git-clone@8: {}
    # The android workflow, running alongside, saves this cache.
    - restore-gradle-cache@3: {}
    - gradle-unit-test@2:
        title: Compose snapshot tests
        inputs:
        - test_task: ":app:sharedUI:testAndroidHostTest"
        # Only the snapshot suites, and a screen that no longer matches its golden fails the build
        # (= scripts/snapshots.sh verify android). --continue is the step's default.
        - gradlew_command_flags: --continue -Psnapshots=only -Proborazzi.verify=true
    - script@1:
        title: Export snapshot diffs
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # Every mismatch leaves <scenario>_compare.png (golden | diff | new) and
            # <scenario>_actual.png behind; deploy them so a red build can be reviewed.
            set -euo pipefail
            shopt -s nullglob
            diffs=(app/sharedUI/build/outputs/roborazzi/*.png)
            if [ ${#diffs[@]} -eq 0 ]; then
              echo "No snapshot diffs"
              exit 0
            fi
            cp "${diffs[@]}" "$BITRISE_DEPLOY_DIR/"
    - deploy-to-bitrise-io@2: {}

  ios:
    summary: Kotlin tests on the iOS simulator, plus an unsigned simulator build of the iOS app.
    meta:
      bitrise.io:
        stack: osx-xcode-27.0.x
        machine_type_id: g2.mac.medium
    steps:
    - git-clone@8: {}
    - restore-gradle-cache@3: {}
    - restore-spm-cache@3: {}
    - gradle-unit-test@2:
        title: Kotlin iOS simulator tests
        inputs:
        - test_task: ":app:sharedLogic:iosSimulatorArm64Test :core:iosSimulatorArm64Test"
    - script@1:
        title: Export iOS test results
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # Gradle Unit Test only exports results of tasks named test*,
            # so hand the iosSimulatorArm64Test reports to Test Reports here.
            set -euo pipefail
            results=$(find . -path '*/build/test-results/iosSimulatorArm64Test/*.xml')
            if [ -z "$results" ]; then
              echo "No iOS test results found"
              exit 0
            fi
            dir="$BITRISE_TEST_RESULT_DIR/kotlin-ios"
            mkdir -p "$dir"
            echo "$results" | xargs -I{} cp {} "$dir/"
            echo '{"test-name":"Kotlin iOS simulator tests"}' > "$dir/test-info.json"
    - xcode-build-for-simulator@3:
        inputs:
        - project_path: app/iosApp/iosApp.xcodeproj
        - scheme: iosApp
        - configuration: Debug
    - save-gradle-cache@1: {}
    - save-spm-cache@1: {}
    - deploy-to-bitrise-io@2: {}

  ios_snapshots:
    summary: SwiftUI snapshot tests, compared with the goldens in app/iosApp/iosAppTests/__Snapshots__.
    meta:
      bitrise.io:
        stack: osx-xcode-27.0.x
        machine_type_id: g2.mac.medium
    steps:
    - git-clone@8: {}
    # The ios workflow, running alongside, saves these caches.
    - restore-gradle-cache@3: {}
    - restore-spm-cache@3: {}
    - xcode-test@6:
        title: SwiftUI snapshot tests
        inputs:
        - project_path: app/iosApp/iosApp.xcodeproj
        - scheme: iosApp
        # The goldens were recorded on this simulator; keep it in sync with scripts/snapshots.sh.
        # On a mismatch, the reference/failure/difference images are in the deployed attachments zip.
        - destination: platform=iOS Simulator,name=iPhone 17,OS=27.0
        # No retries: a first attempt records a missing golden, so a retry would pass against it.
        - test_repetition_mode: none
    - deploy-to-bitrise-io@2: {}

  testflight:
    summary: Signed App Store build of the iOS app, uploaded to App Store Connect for TestFlight.
    triggers:
      tag:
      - name: "v*"
    meta:
      bitrise.io:
        stack: osx-xcode-27.0.x
        machine_type_id: g2.mac.medium
    steps:
    - git-clone@8: {}
    - restore-gradle-cache@3: {}
    - xcode-archive@6:
        inputs:
        - project_path: app/iosApp/iosApp.xcodeproj
        - scheme: iosApp
        - configuration: Release
        - distribution_method: app-store
        - automatic_code_signing: api-key
        # App Store Connect rejects a build number that was already uploaded,
        # so use the Bitrise build number. The first line is the step's default.
        - xcconfig_content: |-
            COMPILER_INDEX_STORE_ENABLE = NO
            CURRENT_PROJECT_VERSION = $BITRISE_BUILD_NUMBER
    - deploy-to-itunesconnect-application-loader@2: {}
    - save-gradle-cache@1: {}
    - deploy-to-bitrise-io@2: {}

  google_play:
    summary: Signed release bundle of the Android app, uploaded to the internal testing track of Google Play.
    triggers:
      tag:
      - name: "v*"
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: standard
    steps:
    - git-clone@8: {}
    - restore-gradle-cache@3: {}
    - gradle-runner@6:
        title: Build release bundle
        inputs:
        - gradle_task: ":app:androidApp:bundleRelease"
        # Google Play rejects a version code that was already uploaded,
        # so use the Bitrise build number. --stacktrace is the step's default.
        - gradle_options: --stacktrace -PversionCode=$BITRISE_BUILD_NUMBER
    # CI has no keystore.properties, so Gradle leaves the bundle unsigned;
    # this signs it with the upload keystore from the Code Signing settings.
    - sign-apk@2: {}
    - google-play-deploy@4:
        inputs:
        - service_account_json_key_path: $BITRISEIO_SERVICE_ACCOUNT_JSON_KEY_URL
        # The applicationId in app/androidApp/build.gradle.kts.
        - package_name: com.example.kmp_mobile_testing
        # Google Play's counterpart of TestFlight. The step's default is alpha (closed testing).
        - track: internal
    - save-gradle-cache@1: {}
    - deploy-to-bitrise-io@2: {}
