format_version: "17"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: kotlin-multiplatform

# Pushes to main and all pull requests run the `ci` pipeline.
# Its `android` and `ios` workflows run in parallel on separate machines.
pipelines:
  ci:
    triggers:
      push:
      - branch: main
      pull_request:
      - source_branch: "*"
    workflows:
      android: {}
      ios: {}

workflows:
  android:
    summary: Unit tests of the shared modules and the server, plus a debug APK.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: standard
    steps:
    - git-clone@8: {}
    - restore-gradle-cache@3: {}
    - gradle-unit-test@2:
        title: Unit tests
        inputs:
        # KMP modules have no plain `test` task, so the tasks are listed explicitly.
        - test_task: >-
            :app:sharedLogic:testAndroidHostTest
            :app:sharedUI:testAndroidHostTest
            :core:testAndroidHostTest
            :core:jvmTest
            :server:test
    - gradle-runner@6:
        title: Build debug APK
        inputs:
        - gradle_task: ":app:androidApp:assembleDebug"
    - save-gradle-cache@1: {}
    - deploy-to-bitrise-io@2: {}

  ios:
    summary: Kotlin tests on the iOS simulator, plus an unsigned simulator build of the iOS app.
    meta:
      bitrise.io:
        stack: osx-xcode-27.0.x
        machine_type_id: g2.mac.medium
    steps:
    - git-clone@8: {}
    - restore-gradle-cache@3: {}
    - gradle-unit-test@2:
        title: Kotlin iOS simulator tests
        inputs:
        - test_task: ":app:sharedLogic:iosSimulatorArm64Test :core:iosSimulatorArm64Test"
    - script@1:
        title: Export iOS test results
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # Gradle Unit Test only exports results of tasks named test*,
            # so hand the iosSimulatorArm64Test reports to Test Reports here.
            set -euo pipefail
            results=$(find . -path '*/build/test-results/iosSimulatorArm64Test/*.xml')
            if [ -z "$results" ]; then
              echo "No iOS test results found"
              exit 0
            fi
            dir="$BITRISE_TEST_RESULT_DIR/kotlin-ios"
            mkdir -p "$dir"
            echo "$results" | xargs -I{} cp {} "$dir/"
            echo '{"test-name":"Kotlin iOS simulator tests"}' > "$dir/test-info.json"
    - xcode-build-for-simulator@3:
        inputs:
        - project_path: app/iosApp/iosApp.xcodeproj
        - scheme: iosApp
        - configuration: Debug
    - save-gradle-cache@1: {}
    - deploy-to-bitrise-io@2: {}
